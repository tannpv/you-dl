[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "you-dl"
version = "0.1.0"
description = "Local YouTube audio and video downloader"
requires-python = ">=3.12"
dependencies = ["PySide6>=6.8,<7", "yt-dlp[default]>=2025.11.12", "psutil>=7,<8"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4", "ruff>=0.12", "mypy>=1.15", "pyinstaller>=6.16", "types-psutil", "pillow>=11"]

[tool.setuptools.package-data]
you_dl = ["assets/*"]

[project.scripts]
you-dl = "you_dl.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
files = ["src"]
check_untyped_defs = true
ignore_missing_imports = true
